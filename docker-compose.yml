# TODO: Define 4 services: db, api, rabbitmq, consumer
#
# Requirements:
# - db: postgres:17-alpine
# - rabbitmq: rabbitmq:3-management, ports 5672 and 15672
# - api: depends_on db and rabbitmq
# - consumer: depends_on rabbitmq

version: "3.9"
services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
   
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      rabbitmq: 
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
  consumer:
    build: 
      context: ./consumer
      dockerfile: Dockerfile
    container_name: consumer
    restart: always
    depends_on:
      - rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}


volumes:
  db_data: